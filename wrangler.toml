# Cloudflare Pages settings for sumbasurf.app (project sumbasurf-app, on the evergrow11 account): a little storage for the player alerts (it remembers which
# Telegram chat to message). The bot key itself is a secret set in Cloudflare, not here.
name = "sumbasurf-app"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "KV"
id = "732d4a884f85425892100a965667f697"

# player alerts go out once a minute from a separate Worker, sumbasurf-alerts (see ../alerts): it gathers them here
[[durable_objects.bindings]]
name = "MINUTE"
class_name = "Minute"
script_name = "sumbasurf-alerts"
